
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Structures Course — Quizzes</title>

<style>
  :root{
    --bg:#0f1220;
    --panel:#171b2e;
    --panel2:#1f2440;
    --border:#2b3156;
    --text:#e9ebf7;
    --muted:#a3a8c9;
    --primary:#7c8cff;
    --primary-dark:#5f6de0;
    --correct:#2ecc71;
    --correct-bg:rgba(46,204,113,0.12);
    --wrong:#ff5c5c;
    --wrong-bg:rgba(255,92,92,0.12);
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(1200px 600px at 20% -10%, #22265a 0%, transparent 60%),
               radial-gradient(1000px 500px at 100% 0%, #1c2a4a 0%, transparent 55%),
               var(--bg);
    color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height:100vh;
    padding:32px 20px 64px;
  }
  .wrap{max-width:900px;margin:0 auto;}
  header.app-header{text-align:center;margin-bottom:32px;}
  header.app-header h1{
    font-size:clamp(24px,4vw,34px);
    margin:0 0 8px;
    background:linear-gradient(90deg,#9db4ff,#c39bff);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  header.app-header p{color:var(--muted);margin:0;font-size:15px;}

  /* HOME */
  .topic-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:16px;
    margin-top:24px;
  }
  .topic-card{
    background:linear-gradient(160deg,var(--panel2),var(--panel));
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:22px 20px;
    cursor:pointer;
    transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    text-align:left;
  }
  .topic-card:hover{
    transform:translateY(-3px);
    border-color:var(--primary);
    box-shadow:0 10px 30px -12px rgba(124,140,255,0.45);
  }
  .topic-card .icon{font-size:26px;margin-bottom:10px;display:block;}
  .topic-card h3{margin:0 0 6px;font-size:17px;}
  .topic-card span.count{color:var(--muted);font-size:13px;}

  .full-quiz-card{
    margin-top:24px;
    background:linear-gradient(120deg,rgba(124,140,255,0.18),rgba(195,155,255,0.12));
    border:1px solid var(--primary);
    border-radius:var(--radius);
    padding:22px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  .full-quiz-card .desc h3{margin:0 0 6px;font-size:18px;}
  .full-quiz-card .desc p{margin:0;color:var(--muted);font-size:14px;}

  button{
    font-family:inherit;
    cursor:pointer;
  }
  .btn{
    background:var(--primary);
    color:#0d0f1e;
    border:none;
    padding:12px 20px;
    border-radius:10px;
    font-weight:600;
    font-size:14px;
    transition:background .15s ease, transform .1s ease;
    white-space:nowrap;
  }
  .btn:hover{background:var(--primary-dark);color:#fff;}
  .btn:active{transform:scale(0.98);}
  .btn.secondary{
    background:transparent;
    color:var(--text);
    border:1px solid var(--border);
  }
  .btn.secondary:hover{border-color:var(--primary);}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}

  /* QUIZ VIEW */
  .quiz-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .quiz-header h2{margin:0;font-size:19px;}
  .quiz-header .meta{color:var(--muted);font-size:13px;}

  .progress-bar{
    height:6px;
    border-radius:999px;
    background:var(--panel2);
    overflow:hidden;
    margin-bottom:24px;
    border:1px solid var(--border);
  }
  .progress-bar > div{
    height:100%;
    background:linear-gradient(90deg,#7c8cff,#c39bff);
    transition:width .25s ease;
  }

  .question-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:26px;
  }
  .source-tag{
    display:inline-block;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--primary);
    background:rgba(124,140,255,0.12);
    border:1px solid rgba(124,140,255,0.35);
    padding:3px 9px;
    border-radius:999px;
    margin-bottom:12px;
  }
  .question-text{
    font-size:18px;
    line-height:1.5;
    margin:0 0 18px;
  }

  .hint-row{margin-bottom:18px;}
  .hint-btn{
    background:none;
    border:1px dashed var(--border);
    color:var(--muted);
    padding:8px 14px;
    border-radius:999px;
    font-size:13px;
  }
  .hint-btn:hover{border-color:var(--primary);color:var(--text);}
  .hint-box{
    margin-top:10px;
    padding:12px 14px;
    background:rgba(255,255,255,0.03);
    border-left:3px solid var(--primary);
    border-radius:6px;
    font-size:14px;
    color:var(--muted);
  }

  .options{display:flex;flex-direction:column;gap:10px;margin-bottom:6px;}
  .option{
    display:flex;
    align-items:flex-start;
    gap:12px;
    text-align:left;
    background:var(--panel2);
    border:1px solid var(--border);
    color:var(--text);
    padding:14px 16px;
    border-radius:10px;
    font-size:15px;
    line-height:1.4;
    transition:border-color .15s ease, background .15s ease;
  }
  .option:hover:not(.answered):not(:disabled){border-color:var(--primary);}
  .option .letter{
    flex:0 0 auto;
    width:26px;height:26px;
    border-radius:50%;
    background:rgba(255,255,255,0.06);
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;color:var(--muted);
  }
  .option.correct{
    background:var(--correct-bg);
    border-color:var(--correct);
  }
  .option.correct .letter{background:var(--correct);color:#06240f;}
  .option.wrong{
    background:var(--wrong-bg);
    border-color:var(--wrong);
  }
  .option.wrong .letter{background:var(--wrong);color:#3a0505;}
  .option:disabled{cursor:default;}

  .explanation{
    margin-top:16px;
    padding:14px 16px;
    border-radius:10px;
    font-size:14px;
    line-height:1.5;
  }
  .explanation.correct-fb{
    background:var(--correct-bg);
    border:1px solid var(--correct);
    color:#c8f7d8;
  }
  .explanation.wrong-fb{
    background:var(--wrong-bg);
    border:1px solid var(--wrong);
    color:#ffd9d9;
  }
  .explanation .label{font-weight:700;display:block;margin-bottom:4px;}
  .explanation .also-correct{
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid rgba(255,255,255,0.12);
    color:var(--muted);
  }

  .nav-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:22px;
    gap:10px;
    flex-wrap:wrap;
  }
  .nav-row .left-group, .nav-row .right-group{display:flex;gap:10px;}

  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
  }

  /* SUMMARY */
  .summary-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:36px;
    text-align:center;
  }
  .summary-score{
    font-size:48px;
    font-weight:800;
    background:linear-gradient(90deg,#9db4ff,#c39bff);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    margin:10px 0;
  }
  .summary-card p{color:var(--muted);}
  .summary-actions{
    display:flex;
    gap:12px;
    justify-content:center;
    margin-top:22px;
    flex-wrap:wrap;
  }

  @media (max-width:520px){
    .question-card{padding:18px;}
    .summary-card{padding:24px;}
  }
</style>
</head>

    {

      "answerOptions": [
        {
          "text": "Elements are stored in contiguous memory locations.",

          "rationale": "Storing items side-by-side in a continuous block is what allows for predictable and fast access by index."

        {
          "text": "Elements are scattered across available RAM slots to maximize space.",

        {
          "text": "The item at the top is viewed without being removed.",
          "isCorrect": false,
          "rationale": "Viewing without removing is a 'Peek' operation, and 'top' is a term usually reserved for stacks."
        },
        {
          "text": "The entire queue is cleared to free up memory.",
          "isCorrect": false,
          "rationale": "Dequeue is a surgical operation on a single element, not a bulk deletion of the entire structure."

      "question": "The 'Last-In-First-Out' (LIFO) principle is the defining characteristic of which data structure?",

        {
          "text": "Queue",

const TOPIC_ICONS = ["🧩","⏱️","🌳","🕸️","🔀"];

let state = { mode: 'home' };

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function prepareQuestions(rawQuestions, randomizeOrder){
  let qs = rawQuestions.map(q => ({
    question: q.question,
    hint: q.hint,
    sourceTopic: q.sourceTopic || null,
    options: shuffle(q.answerOptions)
  }));
  if(randomizeOrder) qs = shuffle(qs);
  return qs;
}

function startTopicQuiz(topicIdx){
  const topic = QUIZZES[topicIdx];
  const questions = prepareQuestions(topic.questions, false);
  state = {
    mode: 'quiz',
    quizTitle: topic.title,
    isFull: false,
    questions,
    currentIndex: 0,
    userAnswers: new Array(questions.length).fill(null),
    hintsShown: new Array(questions.length).fill(false)
  };
  render();
}

function startFullQuiz(){
  const all = [];
  QUIZZES.forEach(topic => {
    topic.questions.forEach(q => all.push(Object.assign({}, q, { sourceTopic: topic.title })));
  });
  const questions = prepareQuestions(all, true);
  state = {
    mode: 'quiz',
    quizTitle: 'Full Quiz — All Topics (Random Order)',
    isFull: true,
    questions,
    currentIndex: 0,
    userAnswers: new Array(questions.length).fill(null),
    hintsShown: new Array(questions.length).fill(false)
  };
  render();
}

function goHome(){
  state = { mode: 'home' };
  render();
}

function selectAnswer(optIdx){
  if(state.userAnswers[state.currentIndex] !== null) return;
  state.userAnswers[state.currentIndex] = optIdx;
  render();
}

function toggleHint(){
  state.hintsShown[state.currentIndex] = !state.hintsShown[state.currentIndex];
  render();
}

function goPrev(){
  if(state.currentIndex > 0){ state.currentIndex--; render(); }
}
function goNext(){
  if(state.currentIndex < state.questions.length - 1){ state.currentIndex++; render(); }
}
function finishQuiz(){
  state.mode = 'summary';
  render();
}
function retakeQuiz(){
  if(state.isFull) startFullQuiz();
  else {
    const idx = QUIZZES.findIndex(t => t.title === state.quizTitle);
    startTopicQuiz(idx);
  }
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.innerText = str;
  return d.innerHTML;
}

function renderHome(){
  const app = document.getElementById('app');
  let cards = QUIZZES.map((t, i) => `
    <div class="topic-card" onclick="startTopicQuiz(${i})">
      <span class="icon">${TOPIC_ICONS[i % TOPIC_ICONS.length]}</span>
      <h3>${escapeHtml(t.title)}</h3>
      <span class="count">${t.questions.length} questions</span>
    </div>
  `).join('');

  app.innerHTML = `
    <header class="app-header">
      <h1>Data Structures Course — Quizzes</h1>
      <p>Pick a topic to practice, or take the full randomized quiz.</p>
    </header>
    <div class="topic-grid">${cards}</div>
    <div class="full-quiz-card">
      <div class="desc">
        <h3>🎲 Full Quiz — All Topics</h3>
        <p>All ${QUIZZES.reduce((s,t)=>s+t.questions.length,0)} questions from every topic, in random order.</p>
      </div>
      <button class="btn" onclick="startFullQuiz()">Start Full Quiz</button>
    </div>
  `;
}

function renderQuiz(){
  const app = document.getElementById('app');
  const total = state.questions.length;
  const idx = state.currentIndex;
  const q = state.questions[idx];
  const answered = state.userAnswers[idx];
  const pct = ((idx + 1) / total) * 100;

  const letters = ['A','B','C','D','E','F'];
  let optionsHtml = q.options.map((opt, i) => {
    let cls = 'option';
    let disabled = '';
    if(answered !== null){
      disabled = 'disabled';
      if(opt.isCorrect) cls += ' correct';
      else if(i === answered) cls += ' wrong';
    }
    return `
      <button class="${cls}" ${disabled} onclick="selectAnswer(${i})">
        <span class="letter">${letters[i] || (i+1)}</span>
        <span>${opt.text}</span>
      </button>
    `;
  }).join('');

  let feedbackHtml = '';
  if(answered !== null){
    const chosen = q.options[answered];
    if(chosen.isCorrect){
      feedbackHtml = `
        <div class="explanation correct-fb">
          <span class="label">✅ Correct!</span>
          ${chosen.rationale || ''}
        </div>`;
    } else {
      const correctOpt = q.options.find(o => o.isCorrect);
      feedbackHtml = `
        <div class="explanation wrong-fb">
          <span class="label">❌ Not quite</span>
          ${chosen.rationale || ''}
          <div class="also-correct"><strong>Correct answer:</strong> ${correctOpt.text} — ${correctOpt.rationale || ''}</div>
        </div>`;
    }
  }

  const hintHtml = q.hint ? `
    <div class="hint-row">
      <button class="hint-btn" onclick="toggleHint()">${state.hintsShown[idx] ? 'Hide hint' : '💡 Show hint'}</button>
      ${state.hintsShown[idx] ? `<div class="hint-box">${q.hint}</div>` : ''}
    </div>` : '';

  const sourceTag = q.sourceTopic ? `<span class="source-tag">${escapeHtml(q.sourceTopic)}</span><br/>` : '';

  const isLast = idx === total - 1;
  const nextBtn = isLast
    ? `<button class="btn" onclick="finishQuiz()">Finish Quiz</button>`
    : `<button class="btn secondary" onclick="goNext()">Next →</button>`;

  app.innerHTML = `
    <div class="topbar">
      <button class="btn secondary" onclick="goHome()">← Topics</button>
    </div>
    <div class="quiz-header">
      <h2>${escapeHtml(state.quizTitle)}</h2>
      <span class="meta">Question ${idx + 1} of ${total}</span>
    </div>
    <div class="progress-bar"><div style="width:${pct}%"></div></div>
    <div class="question-card">
      ${sourceTag}
      <p class="question-text">${q.question}</p>
      ${hintHtml}
      <div class="options">${optionsHtml}</div>
      ${feedbackHtml}
    </div>
    <div class="nav-row">
      <div class="left-group">
        <button class="btn secondary" onclick="goPrev()" ${idx === 0 ? 'disabled' : ''}>← Previous</button>
      </div>
      <div class="right-group">${nextBtn}</div>
    </div>
  `;

  if(window.MathJax && window.MathJax.typesetPromise){
    window.MathJax.typesetPromise([app]).catch(()=>{});
  }
}

function renderSummary(){
  const app = document.getElementById('app');
  const total = state.questions.length;
  let correct = 0;
  state.userAnswers.forEach((ans, i) => {
    if(ans !== null && state.questions[i].options[ans].isCorrect) correct++;
  });
  const unanswered = state.userAnswers.filter(a => a === null).length;
  const pct = Math.round((correct / total) * 100);

  app.innerHTML = `
    <div class="topbar">
      <button class="btn secondary" onclick="goHome()">← Topics</button>
    </div>
    <div class="summary-card">
      <div style="font-size:15px;color:var(--muted)">${escapeHtml(state.quizTitle)}</div>
      <div class="summary-score">${correct} / ${total}</div>
      <p>${pct}% correct${unanswered ? ` · ${unanswered} unanswered` : ''}</p>
      <div class="summary-actions">
        <button class="btn" onclick="retakeQuiz()">🔁 Retake Quiz</button>
        <button class="btn secondary" onclick="goHome()">Back to Topics</button>
      </div>
    </div>
  `;
}

function render(){
  if(state.mode === 'home') renderHome();
  else if(state.mode === 'quiz') renderQuiz();
  else if(state.mode === 'summary') renderSummary();
}

render();
</script>
